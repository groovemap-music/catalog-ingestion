name: Release

on:
  push:
    tags: ["v*"]

permissions:
  attestations: write
  contents: read
  packages: write
  id-token: write

jobs:
  release:
    uses: groovemap-music/automation/.github/workflows/reusable-release.yml@833cb464507678c38ab78bd4718ce697399463e9
    with:
      repository-name: discogs-ingestion
      setup-command: just setup
      check-command: just check
      release-command: just release-dry-run
      artifact-path: dist/discogs-ingestion.tar.gz
      checksums-path: dist/SHA256SUMS
      notices-path: dist/THIRD_PARTY_NOTICES.json
      sbom-path: dist/discogs-ingestion.cdx.json
      publish-image: true
      buildkit-cache-mounts: '{"sccache-discogs-ingestion": "/root/.cache/sccache"}'
